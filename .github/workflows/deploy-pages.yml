name: Deploy Quasi Norte to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Restore hero video
        run: |
          mkdir -p public
          cat video-parts/quasi-loop.part*.b64 | base64 --decode > public/quasi-norte-cube-loop.mp4
          echo "1913ac5fc8451ed154c1f213d468ef1ae4615474faf65775c0490e53a36708c2  public/quasi-norte-cube-loop.mp4" | sha256sum -c -

      - name: Commit hero video asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/quasi-norte-cube-loop.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add real Quasi Norte hero video [skip ci]"
            git push
          fi

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
